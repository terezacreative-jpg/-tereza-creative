<!doctype html>
<html lang="cs">
<head>

  <link rel="stylesheet" href="/css/styles.css">

<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Tereza Creative</a>
      <button id="nav-toggle-3" class="nav-toggle" aria-expanded="false">☰</button>
      <nav id="site-nav-3" class="site-nav">
        <a href="/">Home</a>
        <a href="/about.html">O mně</a>
        <a href="/portfolio.html">Portfolio</a>
        <a href="/contact.html">Kontakt</a>

    </div>

    <button id="lightbox-close-2" class="lightbox-close">✕</button>
    <img id="lightbox-img-2" src="" alt="">

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year-3"></span> Tereza Creative</p>
    </div>

  <script src="/js/main.js"></script>
